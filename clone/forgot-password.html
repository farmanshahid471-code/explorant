<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forget Password - Explorant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<div class="auth-head">
  <a class="logo" href="index.html"><img src="assets/logo.png" alt="Explorant" /></a>
</div>

<div class="auth-body">
  <div class="auth-card">
    <div class="logo-sm"><img src="assets/logo.png" alt="Explorant" /></div>
    <h1>Reset Password</h1>
    <p class="switch">Remembered it? <a href="login.html">Login</a></p>

    <div id="msg"></div>

    <form id="forgotForm" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="username" required />
        <div class="hint">Enter your account e-mail and we'll send a reset link.</div>
      </div>
      <button type="submit" class="btn btn-solid btn-full">SEND RESET LINK</button>
    </form>
  </div>
</div>

<script>
(function(){
  var form = document.getElementById("forgotForm");
  var msg  = document.getElementById("msg");
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var email = document.getElementById("email").value.trim();
    msg.className = "alert";
    if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.textContent = "Please enter a valid e-mail address."; return; }
    // Demo behaviour — short-circuit back to login.
    msg.className = "alert ok";
    msg.textContent = "If that e-mail exists, a reset link has been sent.";
    setTimeout(function(){ window.location.href = "login.html"; }, 1200);
  });
})();
</script>
</body>
</html>
